<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Makine Sayı Tablosu</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:16px system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:16px;max-width:1100px;margin-inline:auto}
h1{font-size:20px;margin:0 0 4px}
h2{font-size:17px;margin:26px 0 8px}
h3{font-size:16px;margin:22px 0 6px}
#st{color:var(--mut);font-size:13px;margin:0 0 12px;min-height:18px}
.mut{color:var(--mut);font-size:14px;margin:0 0 10px}
.bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:6px}
.bar span{color:var(--mut);font-size:14px}
#auth{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:14px;max-width:360px;display:flex;flex-direction:column;gap:8px;margin-bottom:8px}
#auth input,#profil input:not([type=checkbox]),#tarih{height:38px;border:1px solid var(--line);border-radius:4px;background:var(--bg);color:var(--fg);padding:0 10px;font:inherit}
#profil{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:14px;max-width:420px;display:flex;flex-direction:column;gap:8px;margin-bottom:12px}
#profil label.chk{display:flex;gap:10px;align-items:center;font-size:15px;cursor:pointer}
#profil label.chk input{width:20px;height:20px;flex:none}
#profil hr{border:0;border-top:1px solid var(--line);width:100%;margin:8px 0 4px}
button{height:38px;border:0;border-radius:4px;background:var(--blue);color:#fff;font:inherit;font-weight:600;padding:0 14px;cursor:pointer}
button.alt{background:transparent;color:var(--fg);border:1px solid var(--line)}
.scroll{overflow-x:auto;max-width:100%}
table{border-collapse:collapse}
th,td{border:1.5px solid var(--line);padding:0;height:40px}
th{background:var(--blue);color:#fff;font-size:16px;padding:0 12px;min-width:80px;white-space:nowrap}
td.m{background:var(--blue);min-width:150px}
tbody tr:nth-child(odd) td:not(.m):not(.sn){background:var(--row)}
tbody tr:nth-child(even) td:not(.m):not(.sn){background:var(--cell)}
td input{width:100%;height:39px;border:0;background:transparent;color:var(--fg);font:inherit;font-size:17px;text-align:center;padding:0 6px}
td.m input{color:#fff;font-weight:600}
td.m input::placeholder{color:#ffffffaa;font-weight:400}
td input:focus{outline:2px solid #1a73e8;outline-offset:-2px}
td.v,td.t{text-align:center;font-size:17px;padding:0 12px}
td.sn{background:var(--blue);color:#fff;font-weight:600;padding:0 12px;min-width:150px;text-align:center}
tr.tot td{background:var(--tot)!important;color:#111;font-weight:600;text-align:center;padding:0 12px}
#admin{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:14px;margin:12px 0}
#admin .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:8px 0}
#admin input:not([type=checkbox]),#admin select{height:38px;border:1px solid var(--line);border-radius:4px;background:var(--bg);color:var(--fg);padding:0 10px;font:inherit}
#admin hr{border:0;border-top:1px solid var(--line);margin:14px 0}
table.at th{min-width:0;font-size:14px;padding:0 10px}
table.at td{padding:4px 10px;font-size:14px;height:auto;text-align:left;background:var(--cell)}
table.at tr.ban td{background:#ff7c8030}
table.at td.act{white-space:nowrap}
button.sm{height:30px;padding:0 10px;font-size:13px;margin:2px 4px 2px 0}
button.red{background:#d33}
button.grn{background:#2a9d4a}
.badge{display:inline-block;border-radius:10px;padding:1px 9px;font-size:12px;font-weight:600;color:#fff;background:#777}
.badge.adm{background:#7b3fe4}
.badge.ban{background:#d33}
.badge.ok{background:#2a9d4a}
#vardiyaBox{margin:12px 0}
#vardiyaGrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
#tumKullanicilar{margin-top:16px;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;box-shadow:var(--shadow)}
#tumKullanicilar h3{margin:0 0 8px;font-size:15px}
#tumKullanicilar>.sec-head{margin:0 0 8px}
#tumKullanicilar>.sec-head h3{margin:0}
.pen-bas>h3{margin-right:auto;cursor:pointer;user-select:none}
#tumKullanicilar.pen.kapali>.sec-head{margin-bottom:0}
#tumKullanicilar .kisi-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:8px}
#tumKullanicilar .kisi{display:flex;align-items:center;gap:9px;padding:9px 10px;border:1px solid var(--line);border-radius:9px;background:var(--bg);min-width:0}
#tumKullanicilar .kisi .kisi-ad{font-weight:650;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;min-width:0}
#tumKullanicilar .kisi .kisi-alt{font-size:12px;color:var(--mut);margin-top:2px}
#tumKullanicilar .kisi .durum{font-size:11px;font-weight:700;border-radius:999px;padding:3px 8px;white-space:nowrap}
#tumKullanicilar .kisi .durum.on{background:#2ecc4020;color:#23943a}
#tumKullanicilar .kisi .durum.off{background:#e5484d18;color:#d33}
.vcard{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:10px 14px}
.vcard h4{margin:0 0 6px;font-size:16px;color:var(--blue)}
.vgenel{font-size:16px;font-weight:700;margin:0 0 10px}
.dot{display:inline-block;width:11px;height:11px;border-radius:50%;margin-right:7px;vertical-align:middle;background:#d33;box-shadow:0 0 8px 2px #d33}
.dot.on{background:#2ecc40;box-shadow:0 0 8px 2px #2ecc40}
.vcard .vt{color:var(--mut);font-size:13px;margin:0 0 6px}
.vcard ul.vl{list-style:none;padding-left:0}.vcard li .vs{float:right;font-weight:700;margin-left:10px}
#profil select{height:38px;border:1px solid var(--line);border-radius:4px;background:var(--bg);color:var(--fg);padding:0 10px;font:inherit}
.vcard ul{margin:0;padding-left:18px}.vcard li{margin:2px 0}
#vardiyaBox select{height:30px;border:1px solid var(--line);border-radius:4px;background:var(--bg);color:var(--fg);font:inherit;font-size:13px}
#logBox{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:10px 14px;margin:12px 0}
#logBox summary{cursor:pointer;font-size:16px}
#logKul,#logSira{height:38px;border:1px solid var(--line);border-radius:4px;background:var(--bg);color:var(--fg);padding:0 10px;font:inherit}
#logOzet div{margin:2px 0}
/* Telefonda ekran görüntüsü alınırken tablo (TOPLAM satırı dahil) tek ekrana sığsın diye daha kompakt */
@media (max-width:600px){
  #agg table,#users table{width:240px}
  #agg th,#agg td,#users th,#users td{height:30px}
  #agg th,#users th{font-size:14px;padding:0 8px}
  #agg td.sn,#users td.sn{padding:0 8px;font-size:15px}
  #agg td.t,#users td.t,#agg tr.tot td,#users tr.tot td{font-size:15px;padding:0 8px}
  #users h3,h3{margin:14px 0 4px}
}
/* Paylaşılan tablolarda MAKİNE ve SAYI sütunları eşit genişlikte */
#agg table,#users table{table-layout:fixed;width:300px;max-width:100%}
#agg th,#agg td,#users th,#users td{width:50%;min-width:0}
/* ===== Profesyonel tema ===== */
td.sy{min-width:200px;white-space:nowrap}
td.sy input{width:calc(100% - 46px)}
td.sy button.ekle{width:38px;height:30px;padding:0;margin:0 4px 0 0;font-size:20px;line-height:1;vertical-align:middle}
body{max-width:1180px;padding:20px 16px 56px;line-height:1.35}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;padding:0;background:none;border:none;border-radius:0;box-shadow:none;margin:0 0 14px}
.brand{display:flex;gap:12px;align-items:center;min-width:0}
.logo{flex:none;width:44px;height:44px;border-radius:11px;background:linear-gradient(135deg,#00b0f0,#2563eb);color:#fff;display:grid;place-items:center;font-weight:800;font-size:22px}
.top h1{font-size:19px;margin:0}
.top #st{margin:2px 0 0;font-size:13px;min-height:0}
.top .bar{margin:0}
.top #kim{font-size:13px}
h2{font-size:17px;margin:0;display:flex;align-items:center;gap:8px}
h2::before{content:"";width:4px;height:18px;border-radius:2px;background:var(--blue);flex:none}
.sec-head{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin:0 0 12px}
.sec-head .bar{margin:0}
button{border-radius:8px;transition:filter .15s,background .15s}
button:hover{filter:brightness(1.08)}
button.alt:hover{background:var(--row);filter:none}
input:focus,select:focus{outline:2px solid var(--blue);outline-offset:0}
#auth,#profil,#admin,#logBox,#app{border-radius:var(--r);box-shadow:var(--shadow)}
#auth{max-width:none;display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;align-items:center;padding:16px 18px;margin:0 0 14px}
#auth strong{grid-column:1/-1;font-size:15px}
#auth button{width:100%}
#auth input,#auth select{border-radius:8px;height:38px;border:1px solid var(--line);background:var(--bg);color:var(--fg);padding:0 10px;font:inherit}
#app{background:var(--card);border:1px solid var(--line);padding:16px 18px;margin:0 0 14px}
#app h2{margin:0 0 10px}
#profil,#admin{margin:0 0 14px}
#logBox{margin:14px 0 0}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin:0 0 14px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;box-shadow:var(--shadow)}
.stat .k{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--mut)}
.stat .v{font-size:28px;font-weight:800;margin-top:2px}
.stat .s{font-size:12px;color:var(--mut);min-height:15px}
.stat.g .v{color:#2ecc40}
#vardiyaBox{margin:0 0 20px}
#vardiyaGrid{grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}
.vcard{--vc:var(--line);border-radius:var(--r);border-top:3px solid var(--vc);box-shadow:var(--shadow);padding:12px 14px}
.vcard.vA{--vc:#00a7e8}.vcard.vB{--vc:#8b5cf6}.vcard.vC{--vc:#f59e0b}.vcard.vD{--vc:#14b8a6}
.vh{display:flex;align-items:center;gap:10px;margin:0 0 10px}
.vbadge{flex:none;width:34px;height:34px;border-radius:50%;background:var(--vc);color:#fff;display:grid;place-items:center;font-weight:800}
.vname{font-weight:700;font-size:15px}
.vcard .vt{margin:0;font-size:12px}
.vtot{margin-left:auto;font-size:22px;font-weight:800}
.vcard ul.vl{display:flex;flex-direction:column;gap:5px}
.vcard li.vm{display:flex;align-items:center;gap:8px;margin:0;padding:7px 9px;border-radius:8px;background:var(--bg);border-left:3px solid transparent;font-size:14px}
.vcard li.vm.on{border-left-color:#2ecc40}
.vcard li.vm.off{border-left-color:#d33}
.vcard li .vn{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.vcard li .vs{float:none;margin:0;font-weight:700;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:1px 10px;font-size:13px}
.dot{margin-right:0;flex:none}
.panel{margin:0 0 20px}
.ugrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px;align-items:start}
#users{display:contents}
.ucard{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;box-shadow:var(--shadow);min-width:0}
.ucard.gen{border-top:3px solid var(--tot)}
.ucard h3{margin:0 0 10px;font-size:15px}
.ucard .bar{margin:0 0 10px}
.ucard>button{margin-top:10px}
.ucard p.mut{margin:0}
#genel{margin:0 0 12px}
@media (min-width:601px){#agg table,#users table{width:100%}}
@media (max-width:600px){body{padding:12px 10px 40px}.top{padding:0}.stat .v{font-size:24px}}
/* Giriş kartı: en üstte, sade */
#auth{display:flex;flex-direction:column;gap:10px;max-width:440px;margin:0 auto 16px;padding:16px}
.auth-tabs{display:grid;grid-template-columns:1fr 1fr;gap:4px;padding:4px;background:var(--bg);border:1px solid var(--line);border-radius:10px}
.auth-tabs button{height:34px;background:transparent;color:var(--mut);border:0;border-radius:7px;font-weight:600}
.auth-tabs button.on{background:var(--card);color:var(--fg);box-shadow:var(--shadow)}
.auth-tabs button:hover{filter:none}
#auth input,#auth select{height:42px;border-radius:10px;width:100%}
#auth .kayitOnly{display:none}
#auth.kayit-modu .kayitOnly{display:block}
#auth.kayit-modu #giris{display:none}
#auth button#giris,#auth button#kayit{height:42px;border-radius:10px;width:100%;background:var(--blue);color:#fff;border:0}
/* Log tablosu */
#logOzet .oz-card{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin:8px 0}
#logOzet .oz-card>strong{color:var(--fg);font-size:14px}
.oz-chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.oz-chip{display:flex;flex-direction:column;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:4px 10px;min-width:0}
.oz-chip small{font-size:11px;color:var(--mut)}
.oz-chip b{font-size:14px;color:var(--fg)}
.oz-chip.vurgu{border-color:var(--blue)}
.oz-chip.vurgu b{color:var(--blue)}
table.lg{width:100%;font-size:14px}
table.lg th{position:sticky;top:0;font-size:12px;letter-spacing:.04em;padding:8px 10px;text-align:left}
table.lg td{padding:7px 10px;vertical-align:middle;height:auto}
table.lg .lg-t{white-space:nowrap;color:var(--mut);font-variant-numeric:tabular-nums}
table.lg .lg-mk{font-weight:600}
table.lg .lg-alt{font-size:11px;font-weight:400;color:var(--mut)}
table.lg .lg-ayni{display:inline-block;margin-top:3px;padding:1px 7px;border-radius:999px;font-size:11px;font-weight:700;color:#b45309;background:rgba(245,158,11,.18);border:1px solid rgba(245,158,11,.55)}
@media (prefers-color-scheme:dark){table.lg .lg-ayni{color:#fbbf24;background:rgba(251,191,36,.14);border-color:rgba(251,191,36,.5)}}
table.lg .lg-e span{display:inline-block;min-width:44px;text-align:center;font-weight:700;border-radius:999px;padding:1px 10px;background:var(--bg);border:1px solid var(--line)}
table.lg .lg-e .lg-art{color:#2ecc40;border-color:#2ecc4066}
table.lg .lg-e .lg-eks,table.lg .lg-e .lg-sil{color:#e5484d;border-color:#e5484d66}
table.lg .lg-tp{white-space:nowrap;font-variant-numeric:tabular-nums;font-weight:600}
table.lg tr.lg-ad td{opacity:.75}
/* Profil paneli: iki sütun + kapat düğmesi */
#profil{display:block;max-width:none;padding:16px 18px}
.p-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:0 0 12px}
.p-head strong{font-size:16px}
.p-cols{display:grid;grid-template-columns:1fr 1fr;gap:24px}
.p-col{display:flex;flex-direction:column;gap:8px;min-width:0}
.p-col>strong{font-size:14px;color:var(--mut)}
.p-col input:not([type=checkbox]),.p-col select{width:100%;border-radius:8px}
@media (max-width:700px){
  .p-cols{gap:10px}
  .p-col{gap:6px}
  .p-col>strong{font-size:13px}
  .p-col input:not([type=checkbox]),.p-col select{height:40px;padding:0 8px;font-size:15px}
  .p-col .mut,#profil label.chk{font-size:12px}
  #profil label.chk{gap:6px;align-items:flex-start}
  #profil label.chk input{width:16px;height:16px;margin-top:2px}
  .p-col button{height:38px;padding:0 6px;font-size:13px}
}
/* ===== Mobil: sade ve tek sütun ===== */
@media (max-width:600px){
  body{padding:10px 10px 40px;font-size:15px}
  .top{flex-direction:column;align-items:stretch;gap:10px;padding:0}
  .logo{width:38px;height:38px;font-size:19px}
  .top h1{font-size:17px}
  .top .bar{gap:6px}
  .top #kim{width:100%;font-size:12px}
  .top .bar button{flex:1;height:36px;padding:0 8px;font-size:13px}
  #auth{grid-template-columns:1fr;padding:14px}
  .stats{grid-template-columns:1fr 1fr;gap:8px}
  .stat{padding:10px 12px}
  .stat .v{font-size:22px}
  .stat .s{display:none}
  .sec-head{flex-direction:column;align-items:stretch;gap:8px}
  .sec-head .bar{width:100%}
  #tarih{flex:1;min-width:0}
  #vardiyaGrid{grid-template-columns:1fr 1fr;gap:8px}   /* telefonda vardiyalar yan yana (2x2) */
  .vcard{padding:8px;min-width:0}
  .vh{gap:6px;margin:0 0 8px}
  .vbadge{width:26px;height:26px;font-size:13px}
  .vname{font-size:13px}
  .vcard .vt{font-size:11px}
  .vtot{font-size:17px}
  .vcard ul.vl{gap:4px}
  .vcard li.vm{padding:5px 6px;gap:5px;font-size:12.5px;border-left-width:2px}
  .vcard li .vs{padding:0 7px;font-size:12px}
  .dot{width:8px;height:8px;box-shadow:0 0 5px 1px currentColor}
  .dot{color:#d33}.dot.on{color:#2ecc40}
  .ugrid{grid-template-columns:minmax(0,1fr);gap:10px}
  .ucard{padding:12px}
  #agg table,#users table{width:100%;table-layout:fixed}
  #app{padding:12px}
  #app .bar{gap:6px}
  #app .bar button{flex:1 1 auto;font-size:12px;padding:0 8px;height:34px}
  #app .scroll table{width:100%;table-layout:fixed}
  #app th{min-width:0;font-size:12px;padding:0 4px}
  #app th:nth-child(1){width:34%}#app th:nth-child(2){width:22%}#app th:nth-child(3){width:44%}
  #app td.m{min-width:0}
  #app td.sy{min-width:0;white-space:nowrap}
  #app td input{font-size:16px;padding:0 4px}
  #app td.m input{font-size:15px}
  #app td.sy input{width:calc(100% - 38px)}
  #app td.sy button.ekle{width:34px;margin:0 2px 0 0}
  #profil,#admin,#logBox{padding:12px}
  #profil{max-width:none}
  #logBox .bar select,#logBox .bar button{flex:1 1 140px}
  h2{font-size:16px}
  /* Giriş kayıtları: telefon ekranında sütunları ezmek yerine yatay kaydırma */
  #logTbl{display:block;width:100%;max-width:100%;overflow-x:auto;overflow-y:visible;-webkit-overflow-scrolling:touch;touch-action:auto;overscroll-behavior-x:contain}
  #logTbl table.lg{width:760px;min-width:760px;max-width:none;table-layout:auto}
  #logTbl table.lg th,#logTbl table.lg td{font-size:12px;padding:7px 7px;white-space:normal}
  #logTbl table.lg th:nth-child(1),#logTbl table.lg td:nth-child(1){min-width:82px;white-space:nowrap}
  #logTbl table.lg th:nth-child(2),#logTbl table.lg td:nth-child(2){min-width:145px}
  #logTbl table.lg th:nth-child(3),#logTbl table.lg td:nth-child(3){min-width:105px}
  #logTbl table.lg th:nth-child(4),#logTbl table.lg td:nth-child(4){min-width:85px}
  #logTbl table.lg th:nth-child(5),#logTbl table.lg td:nth-child(5){min-width:105px;white-space:nowrap}
  #logTbl table.lg th:nth-child(6),#logTbl table.lg td:nth-child(6){min-width:150px}
  #logTbl table.lg th:nth-child(7),#logTbl table.lg td:nth-child(7){min-width:65px}
}

/* ===== Açılır-kapanır pencereler ===== */
.pen-bas{justify-content:flex-start}
.pen-bas>h2{margin-right:auto;cursor:pointer;user-select:none}
.pen-btn{width:32px;height:32px;padding:0;flex:none;display:inline-flex;align-items:center;justify-content:center;background:transparent;color:var(--fg);border:1px solid var(--line);border-radius:8px;font-size:15px;line-height:1;cursor:pointer}
.pen-btn::before{content:"\25BE";display:block;transition:transform .15s ease}
.pen.kapali .pen-btn::before{transform:rotate(-90deg)}
.pen.kapali>:not(.pen-bas){display:none!important}
.pen.kapali>.pen-bas{margin-bottom:0}
#appHead{margin:0 0 12px}
#logBox summary{user-select:none}
#pList{margin:8px 0;overflow-x:auto}
#pList label{display:flex;gap:10px;align-items:center;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px;cursor:pointer;font-size:14px}
#pList input{width:18px;height:18px;flex:none}
@media (max-width:640px){.pen-bas{flex-direction:row;flex-wrap:wrap;align-items:center}.pen-bas .bar{flex:1 1 100%}}
@media (prefers-reduced-motion:reduce){.pen-btn::before{transition:none}}
.hide{display:none!important}
.gz{display:none!important}
.ort-gizli{display:none!important}
button.alt.sel{background:var(--blue);color:#fff;border-color:var(--blue)}
#gList{margin:8px 0;overflow-x:auto}
#gList label{display:flex;gap:10px;align-items:center;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px;cursor:pointer;font-size:14px}
#gList input{width:18px;height:18px;flex:none}

/* Haftalık ortalama grafiği */
#haftaPanel .ucard,#ayPanel .ucard{padding:12px 14px}
#hGrafik svg{width:100%;height:auto;display:block}
.hc-t{fill:var(--mut);font-size:12px}
.hc-v{fill:var(--fg);font-size:12px;font-weight:700}
.hc-g{stroke:var(--line);stroke-width:1}
.hc-bar{fill:var(--blue)}
.hc-bar.sel{fill:#2563eb}
.hc-bar.fut{fill:var(--line)}
.hc-avg{stroke:#f59e0b;stroke-width:2;stroke-dasharray:6 4}
.hc-avgt{fill:#f59e0b;font-size:12px;font-weight:700}
.hc-col{cursor:pointer}
.hc-col:hover .hc-bar{filter:brightness(1.12)}
#hStat .stat .s{min-height:15px}
.hc-seg{fill:#fff;font-size:11px;font-weight:700;pointer-events:none}
.hc-v{paint-order:stroke;stroke:var(--card);stroke-width:4px;stroke-line
